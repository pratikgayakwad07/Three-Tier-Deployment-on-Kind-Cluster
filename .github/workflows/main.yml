name: Simple Blog App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: pratik0712/backend-service
  FRONTEND_IMAGE: pratik0712/frontend-service

jobs:

  build-test:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build


  docker:
    name: Build and Push Docker Images
    runs-on: self-hosted
    needs: build-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -t "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" -t "${{ env.BACKEND_IMAGE }}:latest" ./backend
      - name: Build Frontend Image
        run: |
          docker build -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" -t "${{ env.FRONTEND_IMAGE }}:latest" ./frontend
      - name: Push Backend Image
        run: |
          docker push "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.BACKEND_IMAGE }}:latest"
      - name: Push Frontend Image
        run: |
          docker push "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"
  deploy:
    name: Deploy to Kind
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Kubernetes Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
      - name: Apply Namespace
        run: kubectl apply -f kubernetes/namespace/

      - name: Apply MySQL
        run: kubectl apply -f kubernetes/mysql/

      - name: Apply Backend
        run: kubectl apply -f kubernetes/backend/

      - name: Apply Frontend
        run: kubectl apply -f kubernetes/frontend/

      - name: Verify Deployment
        run: |
          kubectl get pods -n blog-app
          kubectl get svc -n blog-app
